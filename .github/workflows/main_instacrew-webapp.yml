name: Build and deploy Node.js app to Azure Web App - instacrew-webapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        run: |
          npm install
          npm run build

      # Package everything needed at runtime, including .next
      - name: Prepare app artifact
        run: |
          mkdir -p deploy
          cp -R .next node_modules package.json package-lock.json public deploy/
          # include config files if they exist
          if [ -f next.config.js ]; then cp next.config.js deploy/; fi
          if [ -f tsconfig.json ]; then cp tsconfig.json deploy/; fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D9D97234101D4F48A22F419E53FDFEF8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D45113A2457642389CDE4957368799C3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9FB47E1445AE48F6AD3446A00026B8AA }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'instacrew-webapp'
          slot-name: 'Production'
          package: .
